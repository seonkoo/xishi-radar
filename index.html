<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>量窒息法 · 抄底选股</title>
<style>
:root{
  --bg:#0d1117; --panel:#161b22; --panel2:#1c2230; --line:#2a3140;
  --txt:#e6edf3; --dim:#8b949e; --dim2:#6e7681;
  --up:#f85149; --dn:#3fb950; --gold:#d29922; --blue:#58a6ff; --purple:#bc8cff;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);color:var(--txt);
  font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif}
body{padding-bottom:60px}
a{color:var(--blue);text-decoration:none}
.wrap{max-width:900px;margin:0 auto;padding:0 12px}

/* header */
header{position:sticky;top:0;z-index:50;background:rgba(13,17,23,.96);
  backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.hd{display:flex;align-items:center;gap:10px;padding:10px 12px}
.hd h1{font-size:16px;margin:0;font-weight:600;letter-spacing:.5px}
.hd .sub{font-size:11px;color:var(--dim2);margin-left:auto;text-align:right;line-height:1.3}
.badge{display:inline-block;font-size:10px;padding:1px 6px;border-radius:20px;
  background:rgba(88,166,255,.15);color:var(--blue);border:1px solid rgba(88,166,255,.3)}

/* index strip */
.idxstrip{display:flex;gap:6px;padding:8px 12px;overflow-x:auto;border-bottom:1px solid var(--line);
  background:var(--panel);scrollbar-width:none}
.idxstrip::-webkit-scrollbar{display:none}
.idxcard{flex:0 0 auto;background:var(--panel2);border:1px solid var(--line);border-radius:8px;
  padding:5px 10px;font-size:11px;min-width:104px}
.idxcard .n{color:var(--dim);font-size:10px}
.idxcard .v{font-variant-numeric:tabular-nums;font-weight:600;font-size:13px}

/* tabs */
nav{display:flex;gap:6px;padding:10px 12px 0;overflow-x:auto;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav button{flex:0 0 auto;background:var(--panel);border:1px solid var(--line);color:var(--dim);
  padding:7px 13px;border-radius:20px;font-size:12.5px;cursor:pointer;transition:.15s;white-space:nowrap}
nav button.on{background:rgba(88,166,255,.15);border-color:var(--blue);color:var(--blue);font-weight:600}

/* cards */
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;
  margin:10px 0;overflow:hidden}
.card .top{padding:11px 13px;display:flex;align-items:center;gap:9px;cursor:pointer}
.card .nm{font-size:15px;font-weight:600;letter-spacing:.3px}
.card .cd{font-size:11.5px;color:var(--dim2);font-variant-numeric:tabular-nums}
.card .sc{margin-left:auto;text-align:right;flex:0 0 auto}
.card .sc b{font-size:17px;font-variant-numeric:tabular-nums;display:block;line-height:1.1}
.card .sc span{font-size:9.5px;color:var(--dim2);letter-spacing:.5px}
.arrow{color:var(--dim2);font-size:11px;transition:.2s;flex:0 0 auto}
.card.open .arrow{transform:rotate(90deg)}

.pillrow{display:flex;gap:5px;flex-wrap:wrap;padding:0 13px 9px}
.pill{font-size:10.5px;padding:2px 7px;border-radius:5px;border:1px solid;font-variant-numeric:tabular-nums}
.pill.g{color:var(--dn);border-color:rgba(63,185,80,.35);background:rgba(63,185,80,.1)}
.pill.r{color:var(--up);border-color:rgba(248,81,73,.35);background:rgba(248,81,73,.1)}
.pill.y{color:var(--gold);border-color:rgba(210,153,34,.35);background:rgba(210,153,34,.1)}
.pill.b{color:var(--blue);border-color:rgba(88,166,255,.35);background:rgba(88,166,255,.1)}
.pill.d{color:var(--dim);border-color:var(--line);background:var(--panel2)}

.body{display:none;border-top:1px solid var(--line);padding:12px 13px}
.card.open .body{display:block}

/* checklist */
.chk{display:flex;flex-direction:column;gap:7px;margin-bottom:12px}
.li{display:flex;gap:9px;align-items:flex-start;font-size:12.5px;
  background:var(--panel2);border-radius:8px;padding:8px 10px;border-left:3px solid var(--line)}
.li.ok{border-left-color:var(--dn)}
.li.no{border-left-color:var(--up)}
.li .ico{flex:0 0 auto;font-size:13px;line-height:1.35}
.li .tx{flex:1}
.li .tx b{font-weight:600}
.li .tx i{font-style:normal;color:var(--dim);font-size:11.5px;display:block;margin-top:1px}
.li .val{flex:0 0 auto;font-variant-numeric:tabular-nums;font-weight:600;font-size:12.5px}
.li.ok .val{color:var(--dn)} .li.no .val{color:var(--up)}

/* chart */
.chartbox{background:var(--panel2);border-radius:8px;padding:8px 4px 4px;margin-bottom:10px}
canvas{display:block;width:100%;height:190px}
.legend{display:flex;gap:10px;font-size:10.5px;color:var(--dim2);padding:2px 8px 4px;flex-wrap:wrap}

/* followup table */
table{width:100%;border-collapse:collapse;font-size:12px;font-variant-numeric:tabular-nums}
th,td{padding:5px 4px;text-align:right;border-bottom:1px solid var(--line)}
th:first-child,td:first-child{text-align:left;color:var(--dim)}
th{color:var(--dim2);font-weight:500;font-size:11px}
.pos{color:var(--up)} .neg{color:var(--dn)}

h3{font-size:12.5px;color:var(--dim);margin:14px 0 7px;font-weight:600;letter-spacing:.4px}
h3:first-child{margin-top:0}

/* explain */
.ex{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:13px;margin:10px 0}
.ex p{margin:0 0 9px;font-size:13px;line-height:1.65}
.ex p:last-child{margin-bottom:0}
.ex code{background:var(--panel2);padding:1px 5px;border-radius:4px;font-size:12px;color:var(--purple)}
.hl{color:var(--gold);font-weight:600}
.warn{border-left:3px solid var(--gold);background:rgba(210,153,34,.07);padding:9px 11px;
  border-radius:6px;font-size:12.5px;margin:10px 0;line-height:1.6}
.danger{border-left:3px solid var(--up);background:rgba(248,81,73,.07);padding:9px 11px;
  border-radius:6px;font-size:12.5px;margin:10px 0;line-height:1.6}

/* flow list */
.flowrow{display:flex;align-items:center;gap:8px;padding:7px 10px;background:var(--panel2);
  border-radius:7px;margin-bottom:5px;font-size:12.5px}
.flowrow .nm{flex:1;font-weight:500}
.flowrow .v{font-variant-numeric:tabular-nums;font-weight:600;font-size:12.5px;min-width:68px;text-align:right}
.flowrow .p{font-variant-numeric:tabular-nums;font-size:11.5px;min-width:52px;text-align:right}
.bar{height:3px;border-radius:2px;background:var(--line);overflow:hidden;margin-top:3px}
.bar i{display:block;height:100%}

.muted{color:var(--dim2);font-size:12px;padding:14px 4px;text-align:center}
footer{text-align:center;color:var(--dim2);font-size:10.5px;padding:18px 12px;line-height:1.7}
.spin{display:inline-block;width:12px;height:12px;border:2px solid var(--line);
  border-top-color:var(--blue);border-radius:50%;animation:sp .7s linear infinite;vertical-align:-2px}
@keyframes sp{to{transform:rotate(360deg)}}

/* backtest panel */
.bt{display:grid;grid-template-columns:repeat(auto-fit,minmax(88px,1fr));gap:7px;margin:10px 0}
.btc{background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:9px;text-align:center}
.btc .k{font-size:10.5px;color:var(--dim2);margin-bottom:3px}
.btc .v{font-size:17px;font-weight:700;font-variant-numeric:tabular-nums}
.btc .s{font-size:10px;color:var(--dim2);margin-top:2px}
</style>
</head>

function renderChecklist(h){
  const c = D.cfg;
  const li = [];
  const add = (ok,tx,val,note)=>li.push(
    `<div class="li ${ok?'ok':'no'}">
       <div class="ico">${ok?'✅':'❌'}</div>
       <div class="tx"><b>${tx}</b><i>${note||''}</i></div>
       <div class="val">${val}</div>
     </div>`);

  // 前置：前期已下跌
  const dp = h.dropPct;
  add(dp!=null && dp<=-c.drop_min_pct, '前置① 前期已下跌',
      dp==null?'历史不足':dp.toFixed(1)+'%',
      `近 ${h.dropWin} 日最高收盘 → 缩量日收盘，要求 ≤ -${c.drop_min_pct}%`);

  // ① 量窒息
  add(h.volRatio<=c.vol_ratio, '条件① 量窒息（缩量）',
      h.volRatio.toFixed(2)+'倍',
      `≤ 近${c.vol_win}日均量 × ${c.vol_ratio}　实际量 ${(h.quietVol/1e4).toFixed(1)}万手`);

  // ② 小K线
  add(Math.abs(h.quietPct)<=c.flat_hi, '条件② 小K线（十字星最佳）',
      fmtPct(h.quietPct),
      `当日涨跌幅需 ∈ [${c.flat_lo}%, ${c.flat_hi}%]，实体/振幅 ${h.quietBodyR}`);

  // ③ 大红柱
  const okCover = h.cover;
  add(h.confirmPct>=c.confirm_min_pct && h.bodyRatio>=c.confirm_body_ratio && okCover,
      '条件③ 大红柱覆盖',
      fmtPct(h.confirmPct),
      `涨幅≥${c.confirm_min_pct}% ✓　实体/振幅 ${h.bodyRatio}（≥${c.confirm_body_ratio}）　收盘覆盖前日 ${okCover?'✓':'✗'}`);

  // ④ 放量
  add(h.volMult>=c.confirm_vol_mult, '条件④ 成交量远高于前日',
      h.volMult.toFixed(2)+'倍',
      `≥ 缩量日量 × ${c.confirm_vol_mult}`);

  return `<div class="chk">${li.join('')}</div>`;
}

function drawK(h){
  const k = h.kline || [];
  if(k.length<5) return '<div class="muted">K线数据不足</div>';
  const W=800,H=340,PL=6,PR=6,PT=26,PB=8;
  const volH = 70, gap = 12;
  const priceH = H - volH - gap - PT - PB;

  const hi = Math.max(...k.map(b=>b.h)), lo = Math.min(...k.map(b=>b.l));
  const vmax = Math.max(...k.map(b=>b.v));
  const n = k.length;
  const bw = Math.max(1.5, (W-PL-PR)/n*0.66);
  const step = (W-PL-PR)/n;
  const yP = v => PT + priceH - (v-lo)/(hi-lo||1)*priceH;
  const yV = v => PT+priceH+gap + volH - v/(vmax||1)*volH;

  // 找缩量日/确认日的索引
  const qi = k.findIndex(b=>b.d===h.quietDate);
  const ci = k.findIndex(b=>b.d===h.confirmDate);
  // 均量线（20）
  let out = '';
  const ma=[];
  for(let i=0;i<n;i++){
    if(i>=19){ let s=0; for(let j=i-19;j<=i;j++) s+=k[j].v; ma.push([i, s/20]); }
  }

  // 网格
  for(let g=0;g<=3;g++){
    const y = PT + priceH*g/3;
    out += `<line x1="${PL}" y1="${y}" x2="${W-PR}" y2="${y}" stroke="#2a3140" stroke-width="1" stroke-dasharray="2 4"/>`;
  }

  // K线
  k.forEach((b,i)=>{
    const x = PL + step*i + step/2;
    const up = b.c>=b.o;
    const col = up ? '#f85149' : '#3fb950';
    out += `<line x1="${x}" y1="${yP(b.h)}" x2="${x}" y2="${yP(b.l)}" stroke="${col}" stroke-width="1"/>`;
    const y1=yP(Math.max(b.o,b.c)), y2=yP(Math.min(b.o,b.c));
    out += `<rect x="${x-bw/2}" y="${y1}" width="${bw}" height="${Math.max(1,y2-y1)}" fill="${col}"/>`;
    // 量柱
    out += `<rect x="${x-bw/2}" y="${yV(b.v)}" width="${bw}" height="${PT+priceH+gap+volH-yV(b.v)}"
              fill="${col}" opacity=".55"/>`;
  });

  // 均量线
  if(ma.length>1){
    out += `<polyline fill="none" stroke="#d29922" stroke-width="1.2" opacity=".8" points="${
      ma.map(([i,v])=>`${PL+step*i+step/2},${yV(v)}`).join(' ')}"/>`;
  }

  // 标注
  const mark = (i,txt,col,dy)=>{
    if(i<0) return '';
    const x = PL + step*i + step/2;
    return `<line x1="${x}" y1="${PT}" x2="${x}" y2="${PT+priceH+gap+volH}"
              stroke="${col}" stroke-width="1.4" stroke-dasharray="3 2"/>
            <circle cx="${x}" cy="${yP(k[i].c)}" r="3.4" fill="none" stroke="${col}" stroke-width="1.8"/>
            <text x="${x}" y="${PT-6+dy}" fill="${col}" font-size="13" text-anchor="middle"
              font-weight="700">${txt}</text>`;
  };
  out += mark(qi,'缩量','#d29922',0);
  out += mark(ci,'大红柱','#f85149',16);

  return `<div class="chartbox">
    <svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" style="width:100%;height:190px">${out}</svg>
    <div class="legend">
      <span>🟡 缩量日 ${h.quietDate}</span>
      <span>🔴 确认日 ${h.confirmDate}</span>
      <span>━ 20日均量</span>
      <span>后 ${k.length-1-ci} 根</span>
    </div>
  </div>`;
}

function renderFollowup(h){
  const fu = h.fu || {};
  const rows = [1,2,3,5,10].map(k=>{
    const r = fu['d'+k];
    if(!r) return '';
    return `<tr><td>${k}日</td><td>${r.date}</td><td>${r.close.toFixed(2)}</td>
            <td class="${clsOf(r.pct)}">${fmtPct(r.pct)}</td></tr>`;
  }).join('');
  if(!rows) return '<div class="muted">尚无可统计的后续走势</div>';
  return `<h3>确认日后走势（按确认日收盘 ${fu.entryClose} 买入计）</h3>
    <table><thead><tr><th>持有</th><th>日期</th><th>收盘</th><th>涨跌</th></tr></thead>
    <tbody>${rows}</tbody></table>

}

function renderBoard(b){
  const hits = (b.hits||[]);
  const fresh = hits.filter(h=>h.ageBars<=D.thresholds.fresh);
  const recent = hits.filter(h=>h.ageBars>D.thresholds.fresh);
  let html = `<div class="ex">
    <p><b>${b.name}</b>（${b.code}）　主力净额
      <span class="${clsOf(b.flow)}">${fmtYi(b.flow)}</span>　板块涨跌
      <span class="${clsOf(b.pct)}">${fmtPct(b.pct)}</span></p>
    <p style="color:var(--dim);font-size:12px;margin:0">
      扫描 ${b.scanned} 只（已剔除科创/创业/ST/北交所）　
      近期(${D.thresholds.recent}日内)命中 <b>${b.nRecent}</b>　
      近${D.thresholds.fresh}日 <b>${b.nFresh}</b>　
      历史信号(超期) ${b.nHist||0}</p>
  </div>`;

  if(!hits.length){
    return html + `<div class="muted">该板块近期无符合条件的个股</div>`;
  }
  if(fresh.length){
    html += `<h3>🟡 近${D.thresholds.fresh}个交易日内确认（最值得看）</h3>`;
    html += fresh.map(renderCard).join('');
  }
  if(recent.length){
    html += `<h3>⚪ 更早确认（${D.thresholds.fresh+1}~${D.thresholds.recent}日前，仅作观察）</h3>`;
    html += recent.map(renderCard).join('');
  }
  return html;
}

function renderFlow(){
  const sr = D.sectorRank || [];
  if(!sr.length) return '<div class="muted">无板块数据</div>';
  const mx = Math.max(...sr.map(r=>Math.abs(r.flow)))||1;
  let html = `<div class="ex">
    <p>东财行业板块主力资金净额排行（<b>${D.tradeDate}</b> 收盘口径）。
    资金流入居前 + 板块内有量窒息信号的个股，双重共振时更值得翻一下明细。</p>
  </div>`;
  sr.forEach(r=>{
    const w = Math.abs(r.flow)/mx*100;
    const col = r.flow>0?'var(--up)':'var(--dn)';
    html += `<div class="flowrow">
      <div style="flex:1">
        <div class="nm">${r.name} <span style="color:var(--dim2);font-size:10.5px">${r.code}</span></div>
        <div class="bar"><i style="width:${w}%;background:${col}"></i></div>
      </div>
      <div class="v" style="color:${col}">${fmtYi(r.flow)}</div>
      <div class="p ${clsOf(r.pct)}">${fmtPct(r.pct)}</div>
    </div>`;
  });
  return html;
}

        <div class="val">≥${c.drop_min_pct}%</div></div>

      <div class="li ok"><div class="ico">①</div><div class="tx">
        <b>量窒息</b>
        <i>当日成交量 ≤ 近 ${c.vol_win} 日均量 × ${c.vol_ratio}</i></div>
        <div class="val">≤${c.vol_ratio}倍</div></div>

      <div class="li ok"><div class="ico">②</div><div class="tx">
        <b>小K线</b>
        <i>当日涨跌幅 ∈ [${c.flat_lo}%, +${c.flat_hi}%]（原帖说 ±1%，实测放宽后
        才能覆盖他自己的实例 —— 见下方说明）</i></div>
        <div class="val">±${c.flat_hi}%</div></div>

      <div class="li ok"><div class="ico">③</div><div class="tx">
        <b>大红柱确认</b>
        <i>次日涨幅 ≥ ${c.confirm_min_pct}%　且 实体/振幅 ≥ ${c.confirm_body_ratio}
        （防高开低走假阳）　且 收盘 > 缩量日收盘（「覆盖昨天」）</i></div>
        <div class="val">≥${c.confirm_min_pct}%</div></div>

      <div class="li ok"><div class="ico">④</div><div class="tx">
        <b>放量</b>
        <i>确认日量 ≥ 缩量日量 × ${c.confirm_vol_mult}（「远高于昨天」）</i></div>
        <div class="val">≥${c.confirm_vol_mult}倍</div></div>
    </div>
  </div>

  <div class="ex">
    <h3 style="margin-top:0">时间轴（最容易搞错的地方）</h3>
    <p style="font-size:13px;line-height:1.9">
      <code>缩量日 q</code> → <code>确认日 q+1</code> → <code>介入日 q+2（或确认日尾盘）</code><br>
      原帖说「前天低量、昨天红柱、<b>今天介入</b>」—— 所以：
      <b>收盘后能选的，是「今天确认」的票，明天开盘介入</b>；
      而工具里显示的 <code>ageBars</code> 就是「确认日距今多少根」。</p>
  </div>

  <div class="danger">
    <b>⚠️ 原作者给的实例，数据上并不全对</b><br>
    用腾讯前复权日线逐条核对，4 个实例中：<br>
    · <b>多氟多</b> 2026-08-26 ✓ 成立<br>
    · <b>托伦斯</b> 2026-09-14 ✓ 成立（上市仅 58 个交易日，用自适应窗口）<br>
    · <b>亨通光电</b> 2026-08-24 ✗ 他自家规则要求小K线 ±1%，实测当天 <b>−2.81%</b>，
      按他自己的标准就不该算命中；该股真正成立的是 <b>2026-09-15</b>（次日 +4.77%）<br>
    · <b>嘉立创</b> 2026-08-26 ✗ 上市仅 16 个交易日，20 日均量根本无法计算<br>
    所以本工具的口径是「按他的规则 + 实测校准」，不是照抄他贴的例子。
  </div>

  <div class="ex">
    <h3 style="margin-top:0">怎么用它</h3>
    <p style="font-size:12.5px;line-height:1.8;color:var(--dim)">
      ① <b>收盘后</b>打开，看「近 5 个交易日内确认」那批 —— 这是还能操作的；<br>
      ② 展开看「逐条达标明细」，四条件全 ✅ 才是标准形态；<br>
      ③ <b>命中度评分</b>只表示「多像理想形态」，<b>不是胜率预测</b>，别当概率用；<br>
      ④ 结合<b>板块资金流</b>——板块同步流入 + 个股缩量确认，共振更强；<br>
      ⑤ 「前期跌得深」那一项最容易假阳性：跌 15% 可能只是半山腰。</p>
  </div>`;
}

function renderView(){
  const v = document.getElementById('view');
  if(curTab==='__flow') v.innerHTML = renderFlow();
  else if(curTab==='__bt') v.innerHTML = renderBT();
  else if(curTab==='__how') v.innerHTML = renderHow();
  else {
    const b = D.boards.find(x=>x.code===curTab);
    v.innerHTML = b ? renderBoard(b) : '<div class="muted">无数据</div>';
  }
  // 展开/收起
  v.querySelectorAll('.card .top').forEach(t=>{
    t.onclick = ()=>{
      const card = t.parentElement;
      const code = card.dataset.code;
      if(openSet.has(code)) openSet.delete(code); else openSet.add(code);
      card.classList.toggle('open');
    };
  });
}

/* ---------- 启动 ---------- */
async function boot(){
  if(EMBEDDED){ D = EMBEDDED; }
  else{
    try{
      const r = await fetch('baked.json',{cache:'no-store'});
      D = await r.json();
    }catch(e){
      document.getElementById('view').innerHTML =
        `<div class="muted">数据加载失败：${e.message}<br>请确认 baked.json 与页面同目录</div>`;
      return;
    }
  }
  renderMeta(); renderIdx(); renderTabs(); renderView();
}
boot();
</script>
